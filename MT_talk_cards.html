var EXPLAIN = {
  "takeaway": "Не «тейкавей» и не «на вынос». В докладе: Takeaway. Quality is not one property. На слайде заключения то же одним предложением.",
  "machine-translation": "Задача, не бренд. Сокращение MT при первом вхождении расшифровать. Не путать с CAT (память переводов, терминология).",
  "neural-machine-translation": "NMT — специализированная система, не любой LLM. Dedicated neural MT can still be preferable where terminology control matters. LLM — модель общего назначения, для которой перевод лишь одна задача.",
  "large-language-model": "LLM. Расшифровать при первом вхождении. Не «большая лингвистическая модель». Не антропоморфизировать: the model does not understand, it generates.",
  "prompted-model": "В научном регистре не обязателен «промпт». Open-ended instruction following — свободное следование инструкциям. Prompt sensitivity — чувствительность к формулировке задания.",
  "post-editing": "PE. Трудозатраты не равны качеству. Post-editing is a hypothesis, not a saving. Иногда дольше, чем from-scratch. Сокращение PE в речи лучше один раз расшифровать.",
  "from-scratch-translation": "Не «с царапины». Raters still preferred from-scratch translations more often. Пара к post-editing: не моральный выбор, а сравнение процесса.",
  "trade-off": "Accuracy–naturalness trade-off. Один балл скрывает компромисс. Не «трейдофф». Changing trade-offs — смена компромиссов, не «движение к безошибочности».",
  "human-centered-mt": "Carpuat et al. Не «человеко-ориентированный» как второй синоним. Machine in the loop, not human in the loop as afterthought. Leaderboard ≠ real use.",
  "situated-decision-making": "Язык переводоведения, не IT. The technical stack has not abolished that fact. Не «ситуативное принятие решения» в ед. числе как разовый акт — речь о процессе.",
  "calque": "Не запрет близкого перевода. Avoiding calques is not a policy of translating as freely as possible. The test is what the source is doing. Глагол: to calque / a calqued version.",
  "transposition": "Vinay и Darbelnet. Не «транспозиция» в музыке как главное. Пример хода лекции: change of word class, not a calque of the source syntax.",
  "modulation": "Не радиотехническая модуляция. Change of viewpoint or conventional phrasing. Рядом с transposition, equivalence, adaptation — четыре приёма на одном слайде.",
  "equivalence": "У Vinay/Darbelnet — эквиваленция, не общая «эквивалентность» (equivalence of rights и т.п.). Typical of idioms. Не путать с Nida’s dynamic equivalence без нужды: в докладе четыре процедуры.",
  "adaptation": "Подстройка реалии, не «адаптация модели» в ML. Culture-bound expressions — культурно связанные выражения. Adjustment of a reference to the target situation.",
  "adequacy": "Source-visible adequacy. Не «адекватность» в быту. Пара к fluency: adequacy без оригинала не ставится. В MQM близко accuracy / mistranslation.",
  "fluency": "Ложный друг: fluency не доказывает faithfulness. A fluent sentence is not, by that fact, a translation. В паре с naturalness; в докладе можно говорить fluency or naturalness rating.",
  "naturalness": "Accuracy–naturalness frontier (Flamich et al.). Сообщать оба измерения. Accurate but stiff ≠ reads naturally and omits. Не вращать синонимами вместо fluency, если на слайде уже пара adequacy / fluency.",
  "literality": "Не заимствовать «литералити». Human translations remain less literal. Less literal does not mean the idiom was translated correctly. Индекс Marmonier — эвристика.",
  "deliteralization": "Deliteralization hypothesis. LLMs deliteralize step by step when prompted to revise — but invert human PE triggers. Не «делитерализация» как обязательный термин вслух; можно the outputs become less literal.",
  "mqm": "Multidimensional Quality Metrics. Рамка таксономии. На литературе со студентами ломает результат (Zhang et al.). Для техлокализации остаётся рабочим. Не один взвешенный балл на все жанры.",
  "bleu": "Произносится как blue. Papineni et al., 2002. Valid paraphrase may lose on overlap. В докладе: BLEU was not proposed as a semantic test.",
  "comet": "Не «комета». A COMET number remains a model estimate. Ближе к человеку на многих бенчмарках, не замена рецензии. Рядом ChrF, QE, LLM-as-judge.",
  "quality-estimation": "QE. На идиомах часто выше ставит кальку (Marmonier, Sagot, Bawden 2026). Reference-free. Не «оценка качества» вообще — это как раз adequacy+fluency+MQM.",
  "hallucination": "Не «ложь» и не клиника. Detached or source-unrelated output. Выше на low-resource directions. Smooth prose is not proof of fidelity.",
  "gisting": "Fitness for getting the gist is not fitness for a consent form. Не «гистинг». Gist — общее содержание. Низкие ставки ошибки.",
  "document-level-evaluation": "Sentence-level assessment can miss cohesion. Läubli et al.: при целом документе люди предпочли human на adequacy. Не только «длинный контекст модели».",
  "screening": "Keep automated scores for screening. Не медицинский «скрининг». Screening tools — средство первичного отбора.",
  "fitness-for-purpose": "Task fit на слайде списка. Не вращать с suitability / appropriateness. High-stakes content — материалы высокой ставки. Consent form vs gist.",
  "collocation": "Не «коллаборация» и не calque «коллокация» как единственный вариант: в речи можно target-language collocation. Render meaning in grammar and collocation.",
  "register": "Стилистический регистр, не «регистр» как журнал учёта. Explicit attention to idioms, collocations, register. Literary vs routine notice.",
  "cohesion": "Cohesion and discourse meaning. Не cohesion в материаловедении. Document-level: referents, terminology, discourse links, voice.",
  "low-resource": "Low-resource directions. Антоним high-resource. Resource level is a risk variable, not a footnote. Не «малоресурсный» как второй синоним.",
  "leaderboard": "Не «лидерборд». A leaderboard does not represent communicative situations. Противопоставить real tasks / human-centered evaluation.",
  "best-worst-scaling": "BWS. В Zhang et al. выявляла человеческий художественный перевод в 80–100% против ~60% ошибок MQM у студентов. Меньше диагностики, больше различения сильных вариантов."

var KEY = "lh-mt-talk-known";
var CHIP_NAMES = ["Все", "Технология", "Приёмы", "Оценка", "Буквальность", "Практика"];
var INTRO = {
  "title": "Доклад · машинный перевод",
  "topic": "Термины английского доклада о смысле, кальке и оценке качества машинного перевода (35 единиц)"
};
var INTRO_KEY = KEY + "-intro-seen";
var known = {};
try { JSON.parse(localStorage.getItem(KEY) || "[]").forEach(function (id) { known[id] = true; }); } catch (e) {}
var section = "Все";
var onlyNew = false;
var shuffled = false;
var order = CARDS.map(function (_, i) { return i; });
var cursor = 0;
var face = "front";
var startX = 0;
var swiped = false;
var showIntro = introHasContent();
try {
  if (localStorage.getItem(INTRO_KEY) === "1") showIntro = false;
} catch (e) {}

function introHasContent() {
  if (!INTRO) return false;
  return !!(INTRO.topic || INTRO.title);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(Object.keys(known))); } catch (e) {}
}
function dismissIntro() {
  if (!showIntro) return;
  showIntro = false;
  try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {}
  cursor = 0;
  face = "front";
  render();
}
function photoHtml(card) {
  var p = PHOTO[card.id];
  if (!p) return "";
  var start = p.thumb || p.src;
  var large = (p.src && p.thumb) ? p.src : "";
  var html = '<div class="picture"><img alt="" src="' + start + '" data-large="' + large + '"></div>';
  if (p.credit && p.href && p.href !== "#") {
    html += '<p class="credit"><a href="' + p.href + '" target="_blank" rel="noopener">' + escapeHtml(p.credit) + "</a></p>";
  }
  return html;
}
function upgradePhoto() {
  var img = document.querySelector(".picture img");
  if (!img) return;
  var large = img.getAttribute("data-large");
  if (!large) return;
  var probe = new Image();
  probe.onload = function () { img.src = large; };
  probe.src = large;
}
function isActivateKey(event) {
  var k = event.key;
  if (k === "Enter" || k === " " || k === "Spacebar") return true;
  return event.keyCode === 13 || event.keyCode === 32;
}
function pool() {
  return order.filter(function (i) {
    var card = CARDS[i];
    if (section !== "Все" && card.section !== section) return false;
    if (onlyNew && known[card.id]) return false;
    return true;
  });
}
function escapeHtml(text) {
  return String(text).replace(/[&<>]/g, function (ch) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[ch];
  });
}
function renderChips() {
  var names = CHIP_NAMES;
  document.getElementById("chips").innerHTML = names.map(function (name) {
    return '<button type="button" data-section="' + name + '"' + (name === section ? ' class="on"' : "") + ">" + name + "</button>";
  }).join("");
}
function introBlock(label, text) {
  if (!text) return "";
  var html = "";
  if (label) html += '<p class="intro-label">' + escapeHtml(label) + "</p>";
  return html + '<p class="intro-text">' + escapeHtml(text) + "</p>";
}
function renderIntro() {
  var knownCount = CARDS.filter(function (card) { return known[card.id]; }).length;
  document.getElementById("count").textContent = knownCount + " из " + CARDS.length + " помню";
  document.getElementById("fill").style.width = CARDS.length ? Math.round(knownCount / CARDS.length * 100) + "%" : "0%";
  document.getElementById("unknown").textContent = onlyNew ? "Все карточки" : "Только новые";
  document.body.className = (document.body.className || "").replace(/\bintro-on\b/g, "") + " intro-on";
  var inner = '<p class="kicker">О колоде</p>'
    + '<h2 class="word">' + escapeHtml(INTRO.title || "Колода") + "</h2>"
    + introBlock("", INTRO.topic)
    + '<p class="hint">Нажмите «Дальше», чтобы начать. Эта карточка больше не появится.</p>';
  document.getElementById("stage").innerHTML =
    '<div class="card intro" id="card" role="button" tabindex="0">' + inner + "</div>";
  var cardEl = document.getElementById("card");
  cardEl.addEventListener("click", function (event) {
    if (closestEl(event.target, "a")) return;
    if (swiped) { swiped = false; return; }
    dismissIntro();
  });
  cardEl.addEventListener("keydown", function (event) {
    if (!isActivateKey(event)) return;
    event.preventDefault();
    dismissIntro();
  });
}
function render() {
  var items = pool();
  var knownCount = CARDS.filter(function (card) { return known[card.id]; }).length;
  document.getElementById("count").textContent = knownCount + " из " + CARDS.length + " помню";
  document.getElementById("fill").style.width = CARDS.length ? Math.round(knownCount / CARDS.length * 100) + "%" : "0%";
  document.getElementById("unknown").textContent = onlyNew ? "Все карточки" : "Только новые";
  if (showIntro) {
    renderIntro();
    return;
  }
  document.body.className = (document.body.className || "").replace(/\bintro-on\b/g, "").replace(/^\s+|\s+$/g, "");
  var stage = document.getElementById("stage");
  if (!items.length) {
    stage.innerHTML = '<p class="empty">В этом наборе карточек не осталось. Смените тему или нажмите «Все карточки».</p>';
    return;
  }
  if (cursor >= items.length) cursor = 0;
  var card = CARDS[items[cursor]];
  var word = card.word || card.id;
  var mark = known[card.id] ? " · помню" : "";
  var inner = face === "front"
    ? '<p class="kicker">' + escapeHtml(card.section) + " · " + (cursor + 1) + " / " + items.length + mark + '</p>'
      + '<h2 class="word">' + escapeHtml(word) + '</h2>'
      + '<p class="hint">Нажмите, чтобы увидеть объяснение</p>'
    : '<p class="kicker">' + escapeHtml(word) + "</p>"
      + photoHtml(card)
      + '<p class="ru">' + escapeHtml(card.ru) + "</p>"
      + '<p class="explain">' + escapeHtml(EXPLAIN[card.id]) + "</p>"
      + '<p class="pos">' + escapeHtml(card.pos) + " · " + escapeHtml(card.ipa) + "</p>"
      + '<p class="en">' + escapeHtml(card.en) + "</p>";
  stage.innerHTML = '<div class="card ' + face + '" id="card" role="button" tabindex="0">' + inner + "</div>";
  var cardEl = document.getElementById("card");
  function flipCard(event) {
    if (closestEl(event.target, "a")) return;
    if (swiped) { swiped = false; return; }
    face = face === "front" ? "back" : "front";
    render();
  }
  cardEl.addEventListener("click", flipCard);
  cardEl.addEventListener("keydown", function (event) {
    if (!isActivateKey(event)) return;
    event.preventDefault();
    flipCard(event);
  });
  upgradePhoto();
}
function step(delta) {
  if (showIntro) {
    if (delta > 0) dismissIntro();
    return;
  }
  var items = pool();
  if (!items.length) return;
  cursor = (cursor + delta + items.length) % items.length;
  face = "front";
  render();
}
document.getElementById("chips").addEventListener("click", function (event) {
  var button = closestEl(event.target, "button");
  if (!button) return;
  if (showIntro) {
    showIntro = false;
    try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {}
  }
  section = button.getAttribute("data-section");
  cursor = 0;
  face = "front";
  renderChips();
  render();
});
document.getElementById("prev").addEventListener("click", function () { step(-1); });
document.getElementById("next").addEventListener("click", function () { step(1); });
document.getElementById("again").addEventListener("click", function () {
  if (showIntro) { dismissIntro(); return; }
  var items = pool();
  if (!items.length) return;
  delete known[CARDS[items[cursor]].id];
  save();
  face = "front";
  step(1);
});
document.getElementById("known").addEventListener("click", function () {
  if (showIntro) { dismissIntro(); return; }
  var items = pool();
  if (!items.length) return;
  known[CARDS[items[cursor]].id] = true;
  save();
  face = "front";
  if (onlyNew) render();
  else step(1);
});
document.getElementById("shuffle").addEventListener("click", function () {
  if (showIntro) {
    showIntro = false;
    try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {}
  }
  shuffled = !shuffled;
  order = CARDS.map(function (_, i) { return i; });
  if (shuffled) {
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
  }
  document.getElementById("shuffle").textContent = shuffled ? "По порядку" : "Перемешать";
  cursor = 0;
  face = "front";
  render();
});
document.getElementById("unknown").addEventListener("click", function () {
  if (showIntro) {
    showIntro = false;
    try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {}
  }
  onlyNew = !onlyNew;
  cursor = 0;
  face = "front";
  render();
});
document.getElementById("reset").addEventListener("click", function () {
  if (showIntro) {
    showIntro = false;
    try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {}
  }

  cursor = 0;
  face = "front";
  render();

  renderChips();
  render();
  var nojs = document.getElementById("nojs");
  if (nojs) nojs.style.display = "none";
} catch (err) {
  var box = document.getElementById("nojs");
  if (box) box.textContent = "Ошибка запуска: " + (err && err.message ? err.message : err);
}
</script>
</body>
</html>
